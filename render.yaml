services:
  - type: web
    name: efficient-parking
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: node backend/server.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WEB_ROOT
        value: dist
      - key: SQLITE_PATH
        value: /tmp/parking.sqlite
      - key: SQLITE_JOURNAL_MODE
        value: DELETE
      - key: DEMO_DATA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Administradora
